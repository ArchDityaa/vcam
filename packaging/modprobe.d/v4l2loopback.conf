# Virtual camera output device used by vcam.
#
# video_nr=10        -> /dev/video10
# card_label         -> name applications see
# exclusive_caps=1   -> advertise OUTPUT until a writer streams, then CAPTURE
#                       (prevents Chrome/Zoom from racing enumeration)
# max_buffers=4      -> enough headroom for a 1080p30 producer
options v4l2loopback video_nr=10 card_label="Virtual Camera" exclusive_caps=1 max_buffers=4
