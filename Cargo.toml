[workspace]
resolver = "2"
members = [
    "crates/vcam-core",
    "crates/vcam-doctor",
    "crates/vcamd",
    "crates/vcam-cli",
    "crates/vcam-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
authors = ["ArchDityaa <ArchDityaa@users.noreply.github.com>"]
repository = "https://github.com/ArchDityaa/vcam"
homepage = "https://github.com/ArchDityaa/vcam"
readme = "README.md"
keywords = ["virtual-camera", "webcam", "gstreamer", "v4l2", "linux"]
categories = ["multimedia::video", "os::linux"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "signal",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
gstreamer = { version = "0.23", features = ["v1_24"] }
gstreamer-app = { version = "0.23", features = ["v1_24"] }
gstreamer-video = { version = "0.23", features = ["v1_24"] }
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
