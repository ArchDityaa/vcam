name: Feature request
description: Suggest an idea or an improvement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please explain the problem first, then the
        solution you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that is currently awkward or impossible?
      placeholder: |
        I want to switch between two files on a schedule without restarting
        the daemon.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? CLI flags, config keys, GUI controls...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - vcamd (daemon)
        - vcam (CLI)
        - vcam-gui (GTK4 panel)
        - packaging
        - documentation
        - new component
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to similar features in other tools, and so on.
